name: Build Bliss

on:
  release:
    types: [ "published" ]
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # Build Bliss
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Build Bliss
    - name: Build
      run: dotnet build --no-restore

    # Test
    - name: Test
      run: dotnet test --no-build --verbosity normal

  # Publish to NuGet
  publish-nuget:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    # Enable GitHub OIDC authentication
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    # Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Pack Bliss
    - name: Pack Bliss
      run: dotnet pack src/Bliss -p:PackageVersion=${{ github.event.release.tag_name }} --configuration Release --output nuget

    # Pack Bliss.ImGUI
    - name: Pack Bliss.ImGUI
      run: dotnet pack src/Bliss.ImGUI -p:PackageVersion=${{ github.event.release.tag_name }} --configuration Release --output nuget

    # Authenticate with NuGet using OIDC
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: MrScautHD

    # Publish NuGet packages
    - name: Publish NuGet packages
      run: dotnet nuget push nuget/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
